<body class="font-sans antialiased min-h-screen text-zinc-100 flex flex-col justify-between">

  <script type="text/babel">

      return (
        <svg

    // Initialize PDF.js worker
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // High precision byte formatting
    function formatBytes(bytes, decimals = 2) {
      if (!bytes || bytes === 0) return '0.00 B';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // Preset configurations for agency requirements
    const PRESETS = [
      {
        id: 'strict-5mb',
        label: 'STRENG < 5.0 MB',
        sub: 'Garantierter Upload-Schwellenwert',
        targetMB: 4.85,
        dpiScale: 1.35,
        quality: 0.76,
        grayscale: false,
        desc: 'Automatic adaptive matrix: Iteratively throttles resolution & JPEG packing to guarantee < 5.00 MB compliance.'
      },
      {
        id: 'archiv',
        label: 'ARCHIV / HIGH DENSITY',
        sub: 'Retina Print & Vector Sharpness',
        targetMB: 8.50,
        dpiScale: 1.80,
        quality: 0.88,
        grayscale: false,
        desc: 'Optimized for high-end portfolio dossiers, architectural layouts, and client presentations.'
      },
      {
        id: 'extrem',
        label: 'EXTREM / PITCH DECK',
        sub: 'Ultra-light Mail Dispatch (<2.5 MB)',
        targetMB: 2.20,
        dpiScale: 1.10,
        quality: 0.58,
        grayscale: false,
        desc: 'Aggressive quantization for executive email dispatch, speed-loading mobile pitch decks.'
      },
      {
        id: 'blueprint',
        label: 'MONOCHROM / VERTRAG',
        sub: 'Architectural Blueprint Grayscale',
        targetMB: 3.50,
        dpiScale: 1.40,
        quality: 0.72,
        grayscale: true,
        desc: 'Desaturates all pigments into neutral black & white tones, stripping chrominance weight.'
      }
    ];

    function App() {
      // Document State
      const [file, setFile] = useState(null);
      const [fileName, setFileName] = useState('');
      const [originalBytes, setOriginalBytes] = useState(0);
      const [numPages, setNumPages] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [isGeneratingSample, setIsGeneratingSample] = useState(false);

      // Tuning Settings
      const [selectedPreset, setSelectedPreset] = useState('strict-5mb');
      const [targetMB, setTargetMB] = useState(4.85);
      const [renderScale, setRenderScale] = useState(1.35); // 72 to 200 DPI approx
      const [jpegQuality, setJpegQuality] = useState(0.76);
      const [grayscale, setGrayscale] = useState(false);

      // Pipeline Telemetry State
      const [isProcessing, setIsProcessing] = useState(false);
      const [telemetryLog, setTelemetryLog] = useState('ENGINE IDLE // READY FOR ARTIFACT INPUT');
      const [currentPageProcessing, setCurrentPageProcessing] = useState(0);
      const [currentProgress, setCurrentProgress] = useState(0);
      const [passNumber, setPassNumber] = useState(1);
      const [errorMessage, setErrorMessage] = useState(null);

      // Output Results
      const [compressedBlob, setCompressedBlob] = useState(null);
      const [compressedBlobUrl, setCompressedBlobUrl] = useState(null);
      const [compressedBytes, setCompressedBytes] = useState(null);
      const [pageThumbnails, setPageThumbnails] = useState([]);
      const [activeInspectIndex, setActiveInspectIndex] = useState(0);
      const [inspectorModalOpen, setInspectorModalOpen] = useState(false);

      const fileInputRef = useRef(null);

      // Cleanup object URLs
      useEffect(() => {
        return () => {
          if (compressedBlobUrl) URL.revokeObjectURL(compressedBlobUrl);
        };
      }, [compressedBlobUrl]);

      // Apply Preset Config
      const handleSelectPreset = (preset) => {
        setSelectedPreset(preset.id);
        setTargetMB(preset.targetMB);
        setRenderScale(preset.dpiScale);
        setJpegQuality(preset.quality);
        setGrayscale(preset.grayscale);
      };

      // File Drag & Drop
      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };
      const handleDragLeave = () => setIsDragging(false);
      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const f = e.dataTransfer.files?.[0];
        if (f) ingestFile(f);
      };
      const handleFileInput = (e) => {
        const f = e.target.files?.[0];
        if (f) ingestFile(f);
      };

      // Ingest PDF & Inspect Pages
      const ingestFile = async (rawFile) => {
        if (rawFile.type !== 'application/pdf' && !rawFile.name.toLowerCase().endsWith('.pdf')) {
          setErrorMessage('INVALID ARTIFACT FORMAT. ONLY STANDARD ADOBE .PDF IS PERMITTED.');
          return;
        }

        setErrorMessage(null);
        setCompressedBlob(null);
        setCompressedBytes(null);
        setPageThumbnails([]);
        setCurrentProgress(0);
        setTelemetryLog('ANALYZING STRUCTURE // PDF DOM DECODE INITIALIZED');

        setFile(rawFile);
        setFileName(rawFile.name);
        setOriginalBytes(rawFile.size);

        try {
          const buffer = await rawFile.arrayBuffer();
          const loadingTask = window.pdfjsLib.getDocument({ data: buffer });
          const pdfDoc = await loadingTask.promise;
          setNumPages(pdfDoc.numPages);
          setTelemetryLog(`ARTIFACT INGESTED // ${pdfDoc.numPages} PAGES VERIFIED // READY FOR COMPRESSION MATRIX`);
        } catch (err) {
          console.error(err);
          if (err.name === 'PasswordException') {
            setErrorMessage('SECURITY PROTOCOL: PDF IS ENCRYPTED / PASSWORD PROTECTED. UNLOCK FIRST.');
          } else {
            setErrorMessage('CORRUPT ARTIFACT HEADER: UNABLE TO RENDER VIA WEBASSEMBLY ENGINE.');
          }
          setFile(null);
        }
      };

      // Generate Luxury European Studio Sample Dossier PDF for instant testing
      const generateSampleDossier = async () => {
        setIsGeneratingSample(true);
        setTelemetryLog('GENERATING SYNTHETIC STUDIO PORTFOLIO ARTIFACT (7 PAGES)...');

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4',
            compress: false
          });

          const pagesContent = [
            {
              title: "KRAFTWERK // DOSSIER 2026",
              subtitle: "PORTFOLIO DER MODERNEN ARCHITEKTUR & BRAND SYSTEMS",
              section: "01 / MANIFESTO",
              quote: "Form follows precision. Eliminating digital clutter without degrading visual fidelity."
            },
            {
              title: "MONOLITHIC IDENTITY",
              subtitle: "BRUTALIST EDITORIAL DESIGN CASE STUDY",
              section: "02 / CASE STUDY A",
              quote: "A balance of stark typography and functional white-space created for contemporary European institutions."
            },
            {
              title: "TYPOGRAPHIC MATRICES",
              subtitle: "SWISS STYLE RHYTHM & METRIC PROPORTIONS",
              section: "03 / SPECIFICATIONS",
              quote: "Strict 12-column dynamic grid, modular proportions, and contrast curves."
            },
            {
              title: "ARCHITECTURAL CONCRETE",
              subtitle: "PHOTOGRAMMETRIC RENDERING & SPATIAL DOSSIER",
              section: "04 / SPATIAL DYNAMICS",
              quote: "Material honesty in structural brutalism: Raw exposed shale and steel tensile anchors."
            },
            {
              title: "CLIENT DELIVERABLES & CODES",
              subtitle: "RESTRICTED AUDIT DOCUMENTATION // CONFIDENTIAL",
              section: "05 / AUDIT LOG",
              quote: "Strict non-disclosure material. Verified for client board meeting dispatch."
            },
            {
              title: "FINANCIAL PROJECTIONS 2026-2030",
              subtitle: "CAPITAL ALLOCATION IN CREATIVE COMPUTATION",
              section: "06 / FISCAL SUMMARY",
              quote: "Projected 34% operational reduction through automated client-side processing engines."
            },
            {
              title: "VERIFIKATIONS-ZERTIFIKAT",
              subtitle: "QUALITÄTSKONTROLLE // STUDIO GRADE SEAL",
              section: "07 / SIGN-OFF",
              quote: "APPROVED FOR PHYSICAL SILKSCREEN PRODUCTION AND HIGH-VOLUME DIGITAL ARCHIVAL."
            }
          ];

          pagesContent.forEach((p, idx) => {
            if (idx > 0) doc.addPage('a4', 'portrait');

            // Editorial dark border frame
            doc.setDrawColor(20, 24, 34);
            doc.setLineWidth(1.5);
            doc.rect(12, 12, 186, 273);

            // Subtle inner hairline
            doc.setDrawColor(180, 180, 185);
            doc.setLineWidth(0.2);
            doc.rect(16, 16, 178, 265);

            // Top technical metadata
            doc.setFont('courier', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(80, 85, 95);
            doc.text("KRAFTWERK DOKUMENTE // STUDIO BERLIN-ZÜRICH", 20, 24);
            doc.text(`ARCHIVE ID: KW-2026-00${idx + 1}B`, 135, 24);

            // Horizontal line
            doc.setDrawColor(40, 45, 55);
            doc.setLineWidth(0.5);
            doc.line(20, 27, 190, 27);

            // Section Tag
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10);
            doc.setTextColor(20, 24, 30);
            doc.text(p.section, 20, 40);

            // Large Editorial Headline
            doc.setFontSize(22);
            doc.setTextColor(10, 12, 16);
            doc.text(p.title, 20, 52);

            // Subtitle
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(90, 95, 105);
            doc.text(p.subtitle, 20, 60);

            // Simulated Complex Visual Asset (Dense graphic block to simulate heavy megabytes)
            doc.setFillColor(28, 32, 42);
            doc.rect(20, 70, 170, 90, 'F');

            // Draw technical wireframe matrix inside the asset
            doc.setDrawColor(65, 75, 95);
            doc.setLineWidth(0.3);
            for (let step = 0; step < 170; step += 10) {
              doc.line(20 + step, 70, 20 + step, 160);
            }
            for (let yStep = 0; yStep < 90; yStep += 10) {
              doc.line(20, 70 + yStep, 190, 70 + yStep);
            }

            // Diagonal tension lines to create graphic density
            doc.setDrawColor(220, 225, 235);
            doc.line(20, 70, 190, 160);
            doc.line(20, 160, 190, 70);

            // Center watermark
            doc.setFont('courier', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(240, 245, 255);
            doc.text(`[ HIGH-RESOLUTION DIGITAL ASSET BLOCK // SAMPLE REF #0${idx + 1} ]`, 28, 118);

            // Editorial Body Typography
            doc.setFont('times', 'italic');
            doc.setFontSize(12);
            doc.setTextColor(40, 45, 55);
            const quoteLines = doc.splitTextToSize(`"${p.quote}"`, 165);
            doc.text(quoteLines, 20, 176);

            // Fill Paragraphs with Swiss Graphic design copy
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(60, 65, 75);
            const bodyCopy = "Precision in document engineering is not merely an aesthetic choice; it is an ergonomic mandate. When distributing confidential dossiers, pitches, or comprehensive design systems across global agency networks, strict file constraints enforce clarity. Unnecessary payload bloat is eliminated while preserving structural layout integrity.";
            const splitBody = doc.splitTextToSize(bodyCopy, 168);
            doc.text(splitBody, 20, 195);

            // Footnote & Page numbering
            doc.setFont('courier', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(100, 105, 115);
            doc.text("ENGINEERED IN BROWSER // WEBASSEMBLY COMPILED", 20, 275);
            doc.text(`SEITE ${idx + 1} VON ${pagesContent.length}`, 162, 275);
          });

          const blob = doc.output('blob');
          const sampleFile = new File([blob], "KRAFTWERK_STUDIO_DOSSIER_2026.pdf", { type: "application/pdf" });
          await ingestFile(sampleFile);
        } catch (err) {
          console.error(err);
          setErrorMessage('FAILED TO INITIALIZE TEST DOSSIER: ' + err.message);
        } finally {
          setIsGeneratingSample(false);
        }
      };

      // Full Adaptive Compression Engine
      const runStudioCompression = async () => {
        if (!file) return;

        setIsProcessing(true);
        setErrorMessage(null);
        setPassNumber(1);
        setCurrentProgress(0);

        try {
          const targetBytes = targetMB * 1024 * 1024;
          const buffer = await file.arrayBuffer();
          const pdfDoc = await window.pdfjsLib.getDocument({ data: buffer }).promise;
          const totalPages = pdfDoc.numPages;

          // Adaptive parameters initial setup
          let activeScale = renderScale;
          let activeQuality = jpegQuality;
          let attempt = 1;
          const maxAttempts = 3;

          let bestBlob = null;
          let generatedPreviews = [];

          while (attempt <= maxAttempts) {
            setPassNumber(attempt);
            setTelemetryLog(`PASS 0${attempt} INITIALIZED // SCALE: ${activeScale.toFixed(2)}x // JPEG: ${Math.round(activeQuality * 100)}% // GRAYSCALE: ${grayscale ? 'ON' : 'OFF'}`);

            const { jsPDF } = window.jspdf;
            let targetPdfDoc = null;
            const collectedThumbs = [];

            for (let i = 1; i <= totalPages; i++) {
              setCurrentPageProcessing(i);
              setTelemetryLog(`[PASS ${attempt}] RENDERING MATRIX // PAGE ${i} OF ${totalPages} // RESAMPLING`);
              setCurrentProgress(Math.round(((i - 0.7) / totalPages) * 100));

              const page = await pdfDoc.getPage(i);
              const viewport = page.getViewport({ scale: activeScale });

              // Render onto virtual Canvas
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d', { alpha: false });
              canvas.width = viewport.width;
              canvas.height = viewport.height;

              // Fill with crisp background
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              await page.render({
                canvasContext: ctx,
                viewport: viewport
              }).promise;

              // Apply Architectural Grayscale filter if enabled
              if (grayscale) {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let px = 0; px < data.length; px += 4) {
                  // Standard luminance formula (Rec. 601)
                  const lum = 0.299 * data[px] + 0.587 * data[px + 1] + 0.114 * data[px + 2];
                  data[px] = lum;
                  data[px + 1] = lum;
                  data[px + 2] = lum;
                }
                ctx.putImageData(imgData, 0, 0);
              }

              // Extract point coordinates for original page dimensions
              const originalViewport = page.getViewport({ scale: 1.0 });
              const isLandscape = originalViewport.width > originalViewport.height;
              const orientation = isLandscape ? 'l' : 'p';

              // Convert canvas into compressed JPEG
              const imgDataUrl = canvas.toDataURL('image/jpeg', activeQuality);

              if (i === 1) {
                targetPdfDoc = new jsPDF({
                  orientation: orientation,
                  unit: 'pt',
                  format: [originalViewport.width, originalViewport.height],
                  compress: true
                });
              } else {
                targetPdfDoc.addPage([originalViewport.width, originalViewport.height], orientation);
              }

              targetPdfDoc.addImage(
                imgDataUrl,
                'JPEG',
                0,
                0,
                originalViewport.width,
                originalViewport.height,
                undefined,
                'FAST'
              );

              // Capture preview thumbnail for inspection
              if (attempt === 1 || attempt === maxAttempts || !collectedThumbs.some(t => t.page === i)) {
                collectedThumbs.push({
                  page: i,
                  thumbUrl: imgDataUrl,
                  width: originalViewport.width,
                  height: originalViewport.height
                });
              }

              setCurrentProgress(Math.round((i / totalPages) * 100));
            }

            const outputBlob = targetPdfDoc.output('blob');
            bestBlob = outputBlob;
            generatedPreviews = collectedThumbs;

            setTelemetryLog(`PASS 0${attempt} COMPLETE // MEASURED SIZE: ${formatBytes(outputBlob.size)} (TARGET: < ${targetMB.toFixed(2)} MB)`);

            // Evaluation: Target satisfied or reached hard attempt cap
            if (outputBlob.size <= targetBytes) {
              setTelemetryLog(`TARGET OBJECTIVE SATISFIED // ${formatBytes(outputBlob.size)} IS UNDER ${targetMB.toFixed(2)} MB LIMIT`);
              break;
            } else if (attempt === maxAttempts) {
              setTelemetryLog(`MAX PASSES ACHIEVED // BEST COMPRESSION RATIO REACHED`);
              break;
            }

            // Adaptive calculation for next pass
            const ratio = targetBytes / outputBlob.size;
            // Downscale both resolution & JPEG quantization safely
            activeQuality = Math.max(0.32, activeQuality * Math.pow(ratio, 0.5));
            activeScale = Math.max(0.85, activeScale * Math.pow(ratio, 0.4));
            attempt++;
          }

          setCompressedBlob(bestBlob);
